[project]
name = "backend"
version = "0.1.0"
description = "Backend API for the Cohort coding interview session app"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
